name: "Server"

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: server-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: "Test and build"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21

            -   uses: gradle/actions/setup-gradle@v6

            -   name: "Test and build the server JAR"
                run: ./gradlew :shared:jvmTest :server:test :server:buildFatJar

            -   uses: actions/upload-artifact@v7
                with:
                    name: "server-jar"
                    path: .build/server/libs/server-all.jar
                    retention-days: 7

    image:
        name: "Publish image"
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/download-artifact@v8
                with:
                    name: "server-jar"
                    path: .build/server/libs

            -   uses: docker/setup-qemu-action@v4

            -   uses: docker/setup-buildx-action@v4

            -   uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Build and push for x86 and ARM servers"
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: server/Dockerfile
                    platforms: linux/amd64,linux/arm64
                    push: true
                    tags: |
                        ghcr.io/${{ github.repository_owner }}/habita-server:latest
                        ghcr.io/${{ github.repository_owner }}/habita-server:${{ github.sha }}