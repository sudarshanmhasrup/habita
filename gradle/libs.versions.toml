[versions]
# Library and plugin versions
kotlin = "2.4.21"
androidGradlePlugin = "9.4.1"
activity = "1.13.0"

# android module's configuration information
android-group = "dev.habita.app"
android-version = "1.0.0"

# android module's packaging information
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

[libraries]
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }

[bundles]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }