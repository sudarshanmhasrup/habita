[versions]
# Library and plugin versions
kotlin = "2.4.21"
androidGradlePlugin = "9.5.0"
activity = "1.13.0"
splashScreen = "1.2.0"
composeMultiplatform = "1.12.2"
ktor = "3.6.1"
logback = "1.6.6"

# android module's configuration information
android-group = "dev.habita.app"
android-version = "1.0.0"
android-versionCode = "1"

# android module's packaging information
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

# compose module's configuration information
compose-group = "dev.habita.app.compose"
compose-version = "1.0.0"

# shared module's configuration information
shared-group = "dev.habita.app.shared"
shared-version = "1.0.0"

# server module's configuration information
server-group = "dev.habita.server"
server-version = "1.0.0"

[libraries]
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
splash-screen = { module = "androidx.core:core-splashscreen", version.ref = "splashScreen" }
compose-multiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[bundles]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }